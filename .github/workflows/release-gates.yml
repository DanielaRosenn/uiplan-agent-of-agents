name: release-gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-core:
    name: python-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Sync root dependencies
        run: uv sync --dev

      - name: Check version pinning
        run: python tools/check-versions.py

      - name: Run strict submodule guard
        env:
          PYTHONPATH: framework
        run: python -m uipath_claude.skills.submodule_guard --strict

      - name: Run root pytest
        run: uv run pytest

  studio-api:
    name: studio-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Sync API dependencies
        working-directory: services/uiplan-studio-api
        run: uv sync --dev

      - name: Run API tests
        working-directory: services/uiplan-studio-api
        run: uv run pytest tests

  studio-frontend:
    name: studio-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/uiplan-studio/package-lock.json

      - name: Install dependencies
        working-directory: apps/uiplan-studio
        run: npm ci

      - name: Lint frontend
        working-directory: apps/uiplan-studio
        run: npm run lint

      - name: Test frontend
        working-directory: apps/uiplan-studio
        run: npm test

      - name: Build frontend
        working-directory: apps/uiplan-studio
        run: npm run build
