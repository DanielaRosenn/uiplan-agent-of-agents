      <path d="M68 32 L93 8 L118 32" fill="none" stroke="#A7F3D0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="93" cy="8" r="8" fill="#FDBA74"/>
      <path d="M54 132 L40 166" stroke="#DBEAFE" stroke-width="12" stroke-linecap="round"/>
