  <rect x="0" y="0" width="920" height="240" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="872" height="192" rx="18" fill="#0b1220" stroke="#334155" stroke-width="1"/>

  <g transform="translate(48,62)">
