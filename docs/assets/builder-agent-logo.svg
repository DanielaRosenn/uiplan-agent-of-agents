      <circle cx="86" cy="5" r="7" fill="#A7F3D0"/>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#F8FAFC">
    <text x="262" y="231" font-size="48" font-weight="850" letter-spacing="-1.4">UiPath Builder Agent</text>
    <text x="266" y="271" font-size="22" fill="#BAE6FD">flying robots for Cursor, Claude, MCP tools, UiPlan, and AI-assisted automation</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">
