      <circle cx="86" cy="5" r="7" fill="#38BDF8"/>
    </g>

    <g transform="translate(820 68) rotate(-4) scale(.7)">
      <path d="M35 82 C18 75 11 61 15 49 C19 37 33 33 47 41" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
      <path d="M136 82 C153 75 160 61 156 49 C152 37 138 33 124 41" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
