name: Update Skills Submodule

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update skills submodule
        id: update
        run: |
          cd skills
          git fetch origin main
          
          CURRENT=$(git rev-parse HEAD)
          LATEST=$(git rev-parse origin/main)
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "current=$CURRENT" >> $GITHUB_OUTPUT
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
            
            git checkout main
            git pull origin main
            
            cd ..
            git add skills
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Skills submodule is already up to date"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update UiPath/skills submodule"
          title: "chore: Update UiPath/skills submodule"
          body: |
            Automated update of the UiPath/skills submodule.
            
            **Changes:**
            - Previous: `${{ steps.update.outputs.current }}`
            - Latest: `${{ steps.update.outputs.latest }}`
            
            See [UiPath/skills commits](https://github.com/UiPath/skills/commits/main) for details.
          branch: chore/update-skills-submodule
          delete-branch: true
          labels: |
            dependencies
            automated
