    <text x="811" y="278" fill="#075985">Cursor</text>
    <rect x="891" y="256" width="88" height="34" rx="17" fill="#DCFCE7"/>
    <text x="914" y="278" fill="#166534">MCP</text>
    <rect x="991" y="256" width="92" height="34" rx="17" fill="#FEF3C7"/>
    <text x="1010" y="278" fill="#92400E">Claude</text>
