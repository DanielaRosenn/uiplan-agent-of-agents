<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UiPath Builder Agent flying robots logo</title>
  <desc id="desc">A playful UiPath Builder Agent hero logo with flying robots, AI workflow nodes, and a cursor-shaped editor motif.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.42" stop-color="#0B3156"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="42" fill="url(#sky)"/>
  <circle cx="1035" cy="70" r="140" fill="#38BDF8" opacity="0.08"/>
  <circle cx="183" cy="300" r="180" fill="#FDBA74" opacity="0.08"/>
  <path d="M55 253 C205 136 331 285 481 177 C630 70 750 166 916 89 C1031 36 1110 52 1160 80" fill="none" stroke="#E0F2FE" stroke-opacity="0.15" stroke-width="34" stroke-linecap="round"/>
  <path d="M55 253 C205 136 331 285 481 177 C630 70 750 166 916 89 C1031 36 1110 52 1160 80" fill="none" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>

  <g opacity="0.32" stroke="#BAE6FD" stroke-width="2" fill="none">
    <path d="M729 116 L774 155 L822 126 L875 166"/>
    <path d="M774 155 L774 209 L828 234"/>
    <circle cx="729" cy="116" r="8" fill="#BAE6FD"/>
    <circle cx="774" cy="155" r="8" fill="#BAE6FD"/>
    <circle cx="822" cy="126" r="8" fill="#BAE6FD"/>
    <circle cx="875" cy="166" r="8" fill="#BAE6FD"/>
    <circle cx="774" cy="209" r="8" fill="#BAE6FD"/>
    <circle cx="828" cy="234" r="8" fill="#BAE6FD"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M120 102 L221 146 L150 170 L126 244 Z" fill="#F8FAFC"/>
    <path d="M151 170 L207 260 L180 269 L126 244 Z" fill="#93C5FD"/>
    <path d="M151 170 L220 147 L184 190 Z" fill="#0EA5E9"/>
  </g>

