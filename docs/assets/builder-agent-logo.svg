<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">UiPath Builder Agent logo</title>
  <desc id="desc">A stylized UiPath Builder Agent logo showing a routed automation path from prompt to validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.46" stop-color="#123B61"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="280" rx="34" fill="url(#bg)"/>
  <path d="M42 221 C175 142 269 244 385 172 C489 107 588 148 715 80 C795 37 864 45 918 69" fill="none" stroke="#E0F2FE" stroke-opacity="0.18" stroke-width="28" stroke-linecap="round"/>
  <path d="M42 221 C175 142 269 244 385 172 C489 107 588 148 715 80 C795 37 864 45 918 69" fill="none" stroke="url(#beam)" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <rect x="56" y="60" width="170" height="160" rx="28" fill="#F8FAFC"/>
    <path d="M99 141 L141 96 L184 141 L141 186 Z" fill="#0F766E"/>
    <circle cx="141" cy="141" r="25" fill="#38BDF8"/>
    <path d="M132 141 L141 132 L150 141 L141 150 Z" fill="#F8FAFC"/>
  </g>

  <g fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif">
    <text x="260" y="111" font-size="46" font-weight="800" letter-spacing="-1">UiPath Builder Agent</text>
    <text x="263" y="153" font-size="22" fill="#BAE6FD">Cursor skills + Claude CLI + MCP tools + UiPlan</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="264" y="181" width="106" height="36" rx="18" fill="#E0F2FE"/>
    <text x="294" y="205" fill="#075985">Plan</text>
    <rect x="384" y="181" width="106" height="36" rx="18" fill="#DCFCE7"/>
    <text x="414" y="205" fill="#166534">Build</text>
    <rect x="504" y="181" width="122" height="36" rx="18" fill="#FEF3C7"/>
    <text x="533" y="205" fill="#92400E">Validate</text>
    <rect x="640" y="181" width="108" height="36" rx="18" fill="#FCE7F3"/>
    <text x="672" y="205" fill="#9D174D">Learn</text>
  </g>

  <g fill="#FFFFFF" fill-opacity="0.75">
    <circle cx="795" cy="77" r="8"/>
    <circle cx="828" cy="88" r="5"/>
    <circle cx="861" cy="73" r="7"/>
    <circle cx="890" cy="95" r="4"/>
  </g>
</svg>
