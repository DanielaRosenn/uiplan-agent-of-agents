    <path d="M29 52h52M29 67h52M29 82h40" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="82" r="9" fill="#22c55e"/>
  </g>

  <g transform="translate(188,68)" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif">
