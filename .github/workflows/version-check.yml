name: version-check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-versions:
    name: check version pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify VERSION matches studio app + API
        run: python tools/check-versions.py
